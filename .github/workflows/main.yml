name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./clientServer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.0
          cache: 'pnpm'
          cache-dependency-path: ./clientServer/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm run bundle
      - run: npx nexe dist/bundle.mjs --target linux-x64-18.20.0 --output bin/apex-client-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: apex-client-linux-x64
          path: clientServer/bin/apex-client-linux-x64

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./clientServer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.0
          cache: 'pnpm'
          cache-dependency-path: ./clientServer/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm run bundle
      - run: npx nexe dist/bundle.mjs --target windows-x64-18.20.0 --output bin/apex-client-win-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: apex-client-win-x64
          path: clientServer/bin/apex-client-win-x64.exe

  build-linux-arm64:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./clientServer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.0
          cache: 'pnpm'
          cache-dependency-path: ./clientServer/pnpm-lock.yaml
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static
      - run: pnpm install
      - run: pnpm run bundle
      - run: |
          npx nexe dist/bundle.mjs --target linux-arm64-18.20.0 --output bin/apex-client-linux-arm64 --build
      - uses: actions/upload-artifact@v4
        with:
          name: apex-client-linux-arm64
          path: clientServer/bin/apex-client-linux-arm64

  build-termux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./clientServer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.0
          cache: 'pnpm'
          cache-dependency-path: ./clientServer/pnpm-lock.yaml
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static
      - run: pnpm install
      - run: pnpm run bundle
      - run: |
          npx nexe dist/bundle.mjs --target linux-arm64-18.20.0 --output bin/apex-termux --build
      - uses: actions/upload-artifact@v4
        with:
          name: apex-termux
          path: clientServer/bin/apex-termux
